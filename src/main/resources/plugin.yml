name: EffectSMP-Reimagined
version: '${project.version}'
main: mlnplus.hu.effectsmp.Effectsmp
api-version: '1.21'
description: EffectSMP Reimagined Official Plugin [Made by mlnplus]
author: mlnplus

commands:
  e:
    description: Main EffectSMP command
    usage: /<command> [subcommand]
    aliases: [effectsmp, esmp]

permissions:
  effectsmp.admin:
    description: Access to all admin commands
    default: op
  effectsmp.teszter:
    description: Tester access - all commands except reload, /e set limited to self
    default: false
