# EffectSMP Custom Items & Recipes
# All custom items, their recipes, and cooldowns are defined here

# Reroll - Normal effect reroll
reroll:
  enabled: true
  shape:
    - "DSD"
    - "BHB"
    - "DSD"
  ingredients:
    B: DIAMOND_BlOCK
    S: EFFECT_SHARD
    H: EFFECT_HEART
    D: DIAMOND

