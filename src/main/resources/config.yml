# EffectSMP Configuration

# Language setting (hu/en)
language: en

# Database settings
database:
  # Type: sqlite (local database) or mysql
  type: sqlite
  
  # MySQL settings (only used if type is mysql)
  mysql:
    host: localhost
    port: 3306
    database: effectsmp
    username: root
    password: ""

settings:
  # Show action bar messages
  action-bar-enabled: true

  # Default hearts on first join
  default-hearts: 1

  # Maximum hearts a player can have (0 for unlimited)
  max-hearts: 3
  
  # Limit crafting of special weapons to 1 per server
  limited-crafting-enabled: true

  # Allowed rarities for initial start roll (common, rare, epic, legendary)
  start-roll-rarities:
    - common
    - rare

  # Heart threshold requirements
  hearts-required:
    menu-access: 1
    passive-boost: 2
    item-ability: 2
    active-ability: 3
    cooldown-reduction: 3

  # Passive & Cooldown Modifiers
  modifiers:
    passive-boost-amplifier-add: 1
    cooldown-reduction-multiplier: 0.75

# Shard Loot Drops Configuration
shard-drops:
  ancient-city-chest-chance: 0.075 # 7.5%
  end-city-chest-chance: 0.075     # 7.5%
  mansion-chest-chance: 0.075      # 7.5%
  warden-kill-chance: 0.15         # 15%

# Updater settings
updater:
  # Check for updates on startup via Modrinth API
  check-updates: true
